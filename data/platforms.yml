# Source of truth for the Cost Comparison tables in README.md.
#
# Edit a row here, set verified_on to the day you checked the vendor's
# pricing page, then run `pnpm gen:tables` to rewrite the README tables.
# CI fails if the README and this file disagree, and a weekly job opens a
# `price-check` issue for every row whose verified_on is older than 90 days.


name: Guides CI

# Docs-as-code checks: the guides' snippets must parse and lint, the README
# tables must match data/platforms.yml, the docs site must build, and the
# smoke tests must be able to run the apps the guides walk through.
# The weekly run catches upstream drift (a new create-vite, a yanked pin)
# even when nobody touches the repo.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guides-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  # sha256 of actionlint_<version>_linux_amd64.tar.gz; bump with the version.
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  snippets:
    name: Snippets, tables and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint this repo's own workflows
        run: actionlint

      - name: Parse and lint every code block in the guides
        run: pnpm check:snippets

      - name: README tables match data/platforms.yml
        run: pnpm check:tables

      - name: Build the docs site
        run: pnpm docs:build

  smoke:
    name: Smoke ${{ matrix.guide }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        guide: [fastapi, flask, django, react-vite, github-pages]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke ${{ matrix.guide }}

  report:
    name: Report scheduled failures
    needs: [snippets, smoke]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a guide-smoke issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create guide-smoke --color D93F0B --description "A guide's commands stopped working in the weekly smoke test" --force
          body="The weekly Guides CI run failed: $RUN_URL"$'\n\n'"Open the failed job to see which guide step broke."
          existing=$(gh issue list --label guide-smoke --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Guide smoke test failed on $(date -u +%Y-%m-%d)" --label guide-smoke --body "$body"
          fi
